name: aban_as
description: aban AS - قبض آب ساختمان
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  file_picker: ^8.1.2
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B3B7A"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#06224A"
  image: assets/logo.png
  android: true
  ios: false
