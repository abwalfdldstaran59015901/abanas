name: Build APK (Flutter)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create a fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org ir.aban --project-name aban_as .

      - name: Raise compileSdk for all plugins
        run: python3 tool/fix_android.py

      - name: Get packages
        run: flutter pub get

      - name: Generate app icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aban-as-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

